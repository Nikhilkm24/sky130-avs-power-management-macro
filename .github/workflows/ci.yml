name: AVS Macro Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rtl-and-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: Run Closed-Loop Behavioral Validation Model
        run: |
          python models/closed_loop_avs_sim.py

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run RTL Verification Testbenches
        run: |
          iverilog -g2012 -o sim_controller.vvp rtl/controller/avs_controller.v sim/tb_controller.v
          vvp sim_controller.vvp
