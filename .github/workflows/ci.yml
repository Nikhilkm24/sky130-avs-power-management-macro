name: AVS Macro Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: RTL Simulation, Lint & Modeling Sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: Check Codebase Formatting (.editorconfig)
        run: |
          python scripts/check_formatting.py

      - name: Run Closed-Loop Behavioral Validation Model
        run: |
          python models/closed_loop_avs_sim.py

      - name: Run CPM Delay Correlation & PVT Characterization Model
        run: |
          python models/cpm_calibration.py

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Lint RTL Sources with Icarus Verilog
        run: |
          iverilog -Wall -g2012 -s avs_system_top -o /tmp/lint_check.vvp \
            rtl/level_shifter/level_shifter.v \
            rtl/load/pipelined_mac_load.v \
            rtl/cpm/critical_path_monitor.v \
            rtl/controller/avs_controller.v \
            rtl/top/avs_system_top.v
          rm -f /tmp/lint_check.vvp

      - name: Run Critical Path Monitor (CPM) Testbench
        run: |
          iverilog -g2012 -o sim_cpm.vvp rtl/cpm/critical_path_monitor.v sim/tb_cpm.v
          vvp sim_cpm.vvp

      - name: Run Coherent Gray-Code CDC Synchronizer Testbench
        run: |
          iverilog -g2012 -o sim_cdc.vvp rtl/level_shifter/level_shifter.v sim/tb_cdc.v
          vvp sim_cdc.vvp

      - name: Run AVS Controller FSM Testbench
        run: |
          iverilog -g2012 -o sim_controller.vvp rtl/controller/avs_controller.v sim/tb_controller.v
          vvp sim_controller.vvp

      - name: Run Integrated Top-Level System Testbench
        run: |
          iverilog -g2012 -o sim_avs_top.vvp \
            rtl/level_shifter/level_shifter.v \
            rtl/load/pipelined_mac_load.v \
            rtl/cpm/critical_path_monitor.v \
            rtl/controller/avs_controller.v \
            rtl/top/avs_system_top.v \
            sim/tb_avs_top.v
          vvp sim_avs_top.vvp

      - name: Validate Cross-Corner PVT Matrix
        run: |
          cat reports/pvt_cross_corner_matrix.rpt
